services:
  postgres:
    image: postgres:16-alpine
    container_name: food_delivery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food_delivery_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/food_delivery?schema=public
      PORT: 3000
      JWT_SECRET: food_delivery_jwt_access_secret_key_2026
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: food_delivery_jwt_refresh_secret_key_2026
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - '3000:3000'

volumes:
  postgres_data:
